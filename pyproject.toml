[project]
name = "japan-weather"
version = "0.2.1"
description = "A gorgeous CLI tool for querying current weather and 1-week forecasts in Japan, optimized with local caching and JMA metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.1",
    "platformdirs>=4.10.0",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
jpweather = "jpweather.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
